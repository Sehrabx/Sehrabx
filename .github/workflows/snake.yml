name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sehrabx
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%23800080&color_dots=%23161B22,%230B542A,%23139A43,%2326C65A,%2339D353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23800080&color_dots=%23161B22,%230B542A,%23139A43,%2326C65A,%2339D353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
